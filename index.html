<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon</title>
<style>
  :root {
    --bg: #181818;
    --lime: #b5f23d;
    --cream: #f4f3ee;
    --ink: #1c1c1c;
    --muted: #8b8b86;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: "Space Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 2rem;
    text-align: center;
  }
  .brand {
    font-size: clamp(1rem, 3vw, 1.25rem);
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--cream);
  }
  .brand span { color: var(--lime); margin: 0 .15em; }
  .keys {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .key {
    font-size: clamp(1.5rem, 6vw, 2.75rem);
    font-weight: 700;
    color: var(--ink);
    padding: 0.55em 1.1em;
    border-radius: 0.45em;
    border: 2px solid var(--ink);
    box-shadow: 0 6px 0 rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
    transition: transform .12s ease, box-shadow .12s ease;
    cursor: default;
    user-select: none;
  }
  .key:hover { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.55); }
  .key.lime  { background: var(--lime); }
  .key.cream { background: var(--cream); }
  .plus {
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    font-weight: 700;
    color: #fff;
  }
  p {
    color: var(--muted);
    font-size: clamp(.9rem, 2.4vw, 1.05rem);
    max-width: 34ch;
    line-height: 1.6;
  }
  p span { color: var(--lime); }
  footer {
    position: absolute;
    bottom: 1.5rem;
    font-size: .75rem;
    color: #55554f;
  }
</style>
</head>
<body>
  <div class="brand">Alt<span>+</span>Ctrl</div>
  <div class="keys" role="img" aria-label="Coming plus Soon">
    <span class="key lime">Coming</span>
    <span class="plus">+</span>
    <span class="key cream">Soon</span>
  </div>
  <p>Something good is loading. Check back <span>soon</span>.</p>
  <footer>&copy; <script>document.write(new Date().getFullYear())</script> Alt+Ctrl</footer>
</body>
</html>
